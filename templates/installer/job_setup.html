{% extends "base.html" %}
{% block title %}— Job Setup{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h4 class="fw-bold mb-1">Job setup</h4>
        <div class="text-muted">{{ job.estimate.title }} &middot; {{ job.customer.name }}</div>
      </div>
      <span class="badge badge-{{ job.status }} text-uppercase">{{ job.status.replace('_', ' ') }}</span>
    </div>

    <div class="card p-4">
      <form method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Crew size</label>
            <input type="number" min="1" step="1" name="crew_size" class="form-control"
                   value="{{ job.crew_size or '' }}" placeholder="e.g. 3">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Target start date</label>
            <input type="date" name="scheduled_date" class="form-control"
                   value="{{ job.scheduled_date.isoformat() if job.scheduled_date else '' }}">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Site notes / special instructions</label>
          <textarea name="site_notes" class="form-control" rows="4"
                    placeholder="Site access, safety requirements, equipment needed…">{{ job.site_notes or '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-success">Save job setup</button>
          <a href="{{ url_for('job_detail', job_id=job.id) }}" class="btn btn-outline-secondary">Skip for now</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
